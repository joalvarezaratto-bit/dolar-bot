name: Informe dolar (cada 30 min)

# Manda el informe completo del USD/CLP (analisis + riesgos + reportes +
# Fibonacci + grafico + noticias) cada 30 minutos.

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min
  workflow_dispatch:          # boton para correrlo a mano

permissions:
  contents: write

concurrency:
  group: dolarbot-estado      # mismo grupo que alertas: nunca corren a la vez
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Enviar informe completo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python dolarbot.py report --gate
      - name: Guardar estado
        run: |
          git config user.name "dolar-bot"
          git config user.email "dolar-bot@users.noreply.github.com"
          # 1) commitear el estado PRIMERO. Cada archivo POR SEPARADO: si uno
          #    no existe todavia (ej. eventos_seen.json), no debe bloquear a los
          #    demas (git add es atomico y fallaria con todos juntos).
          git add news_seen.json 2>/dev/null || true
          git add state.json 2>/dev/null || true
          git add eventos_seen.json 2>/dev/null || true
          git commit -m "estado: informe enviado" || { echo "sin cambios"; exit 0; }
          # 2) recien ahora sincronizar (working tree ya limpio) y subir, con reintento
          git push || (git pull --rebase --autostash && git push) || echo "no se pudo subir, la proxima corrida reintenta"
